<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Editor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Hello World</h1>
    <canvas id="myCanvas"></canvas>

    <div id="controls"><</div>

    <script src="js/math/graph.js"></script>
    <script src="js/primitives/point.js"></script>
    <script src="js/primitives/segment.js"></script>
    <script src="js/graphEditor.js"></script>
    <script>
      function clearCanvas() {
        graph.dispose();
        ctx.clearRect(0, 0, myCanvas.width, myCanvas.height);
        graph.draw(ctx);
      }
      function removeRandomSegment() {
        if (graph.segments.length == 0) {
          console.log("No Segments");
          return;
        }
        const index = Math.floor(Math.random() * graph.segments.length);
        graph.removeSegment(graph.segments[index]);
        ctx.clearRect(0, 0, myCanvas.width, myCanvas.height);
        graph.draw(ctx);
      }
      function removeRandomPoint() {
        if (graph.points.length == 0) {
          console.log("No Points");
          return;
        }
        const index = Math.floor(Math.random() * graph.points.length);
        graph.removePoint(graph.points[index]);
        ctx.clearRect(0, 0, myCanvas.width, myCanvas.height);
        graph.draw(ctx);
      }
      function addRandomSegment() {
        const index1 = Math.floor(Math.random() * graph.points.length);
        const index2 = Math.floor(Math.random() * graph.points.length);
        const p1 = graph.points[index1];
        const p2 = graph.points[index2];
        const s = new Segment(p1, p2);
        const success = graph.tryAddSegment(s);
        ctx.clearRect(0, 0, myCanvas.width, myCanvas.height);
        graph.draw(ctx);
        console.log(success);
      }
      function addRandomPoint() {
        const x = Math.random() * myCanvas.width;
        const y = Math.random() * myCanvas.height;
        const p = new Point(x, y);
        const sucess = graph.tryAddPoint(p);
        ctx.clearRect(0, 0, myCanvas.width, myCanvas.height);
        graph.draw(ctx);
        console.log(sucess);
      }

      myCanvas.width = 600;
      myCanvas.height = 600;

      const ctx = myCanvas.getContext("2d");

      //   const p1 = new Point(200, 200);
      //   const p2 = new Point(500, 200);
      //   const p3 = new Point(400, 400);
      //   const p4 = new Point(100, 300);
      //   const p5 = new Point(300, 100);

      //   const s1 = new Segment(p1, p2);
      //   const s2 = new Segment(p1, p3);
      //   const s3 = new Segment(p1, p4);
      //   const s4 = new Segment(p4, p5);
      //   const s5 = new Segment(p5, p1);

      //   const graph = new Graph([p1, p2, p3, p4, p5], [s1, s2, s3, s4, s5]);
      const graph = new Graph();
      const graphEditor = new GraphEditor(myCanvas, graph);

      animate();

      function animate() {
        ctx.clearRect(0, 0, myCanvas.width, myCanvas.height);
        graphEditor.display();
        requestAnimationFrame(animate);
      }
    </script>
  </body>
</html>
